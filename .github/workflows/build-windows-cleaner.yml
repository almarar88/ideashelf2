name: Build CleanShelf Windows exe

on:
  push:
    branches: [main, master]
    paths:
      - 'windows-cleaner-app/**'
      - '.github/workflows/build-windows-cleaner.yml'
  pull_request:
    paths:
      - 'windows-cleaner-app/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-cleaner-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-cleaner-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build installer + portable exe
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CleanShelf-windows-build
          path: |
            windows-cleaner-app/dist/*.exe
          if-no-files-found: error
