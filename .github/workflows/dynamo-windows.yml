name: Build Dynamo for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "dynamo-v*"

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mbzuh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mbzuh/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Dynamo-Setup-Windows
          path: mbzuh/release/Dynamo-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/dynamo-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mbzuh/release/Dynamo-Setup-*.exe
