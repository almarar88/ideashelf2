name: Build Awn APK

on:
  push:
    paths:
      - 'daily-companion/**'
      - '.github/workflows/android-rafeeq.yml'
  pull_request:
    paths:
      - 'daily-companion/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # أسماء دوالّ الاختبار عربية بين علامتَي `، فتصير أسماء ملفّات .class
    # عربية. مترجم Kotlin يفشل بـ InvalidPathException إن لم تكن محارف
    # نظام الملفّات UTF-8 — عُثر على هذا محلّيًا حيث اللغة POSIX.
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: daily-companion

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # الحزمة `tools` سُحبت من مستودع جوجل، وهي ضمن الافتراضي لهذا الإجراء،
      # فكان `sdkmanager tools` يفشل ويسقط البناء قبل أن يُترجم سطر واحد —
      # سبب فشل كل بناء أندرويد هنا، لا خطأ في الكود. والتراخيص كانت تُطبع
      # كاملةً فتدفن الخطأ تحت ألف سطر، فأُسكتت.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awn-release-apk
          path: daily-companion/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # الإصدار يعطي رابط تنزيل مباشرًا بلا تسجيل دخول، بخلاف ملفات Actions
      # التي تتطلّب حسابًا وتنتهي صلاحيتها.
      - name: نشر إصدار للتنزيل المباشر
        if: github.ref == 'refs/heads/claude/daily-companion-app-8fnen3'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: عون للأندرويد — بناء ${{ github.run_number }}
          body: |
            نسخة الأندرويد من عون.

            نزّل ملف APK وثبّته. قد يطلب هاتفك السماح بالتثبيت من مصدر غير
            معروف — هذا متوقّع لأي تطبيق خارج المتجر.
          files: daily-companion/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: daily-companion/app/build/reports/tests/
