name: Build Alcode Ai APK

on:
  push:
    paths:
      - 'daily-companion/**'
      - '.github/workflows/android-rafeeq.yml'
  pull_request:
    paths:
      - 'daily-companion/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-companion

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alcode-ai-release-apk
          path: daily-companion/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # الإصدار يعطي رابط تنزيل مباشرًا بلا تسجيل دخول، بخلاف ملفات Actions
      # التي تتطلّب حسابًا وتنتهي صلاحيتها.
      - name: نشر إصدار للتنزيل المباشر
        if: github.ref == 'refs/heads/claude/daily-companion-app-8fnen3'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Alcode Ai للأندرويد — بناء ${{ github.run_number }}
          body: |
            نسخة الأندرويد من Alcode Ai.

            نزّل ملف APK وثبّته. قد يطلب هاتفك السماح بالتثبيت من مصدر غير
            معروف — هذا متوقّع لأي تطبيق خارج المتجر.
          files: daily-companion/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: daily-companion/app/build/reports/tests/
