appId: com.dynamo.academic
productName: Dynamo
copyright: الدينامو — نظام الإدارة الأكاديمية الشامل
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!**/*.map"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Dynamo-${version}-win-${arch}.${ext}
  executableName: Dynamo
nsis:
  artifactName: Dynamo-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: الدينامو
  installerLanguages: [ar_SA, en_US]
  language: 1025
  deleteAppDataOnUninstall: false
